name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    name: Integration tests (real PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U lab" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://lab:lab@127.0.0.1:5440/postgres
      # The harness starts (and kills) its own redis-server processes for the outage tests.
      REDIS_SERVER_BIN: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      # Recovery tests spawn the compiled apps as child processes so they can be SIGKILLed.
      - run: pnpm build
      - run: pnpm test:integration

  e2e:
    name: Playwright e2e (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U lab" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://lab:lab@127.0.0.1:5440/postgres
      REDIS_URL: redis://127.0.0.1:6390
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - run: pnpm build
      - run: pnpm --filter @lab/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Healthy scenario through the dashboard proxy
        run: node scripts/compose-smoke.mjs http://127.0.0.1:8080
      - if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v
