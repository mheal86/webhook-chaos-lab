server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # Client-side routes (React Router) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
